<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta property="og:type" content="website">
<meta property="og:title" content="3D 空間模型（5.2 × 5.5 × 2.6 m）">
<meta property="og:description" content="可旋轉、縮放的互動 3D 空間模型，手機可直接開啟。">
<meta property="og:url" content="https://azaz21525162-netizen.github.io/3d-room/">
<meta property="og:image" content="https://azaz21525162-netizen.github.io/3d-room/render_iso.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1450a0">
<title>空間 3D 模型 — 5.2 × 5.5 × 2.6 m</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#e9ecef}
#view{position:fixed;inset:0;touch-action:none}
#view canvas{display:block;touch-action:none}
#bar{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
#bar button{border:0;border-radius:8px;padding:8px 14px;font-size:15px;background:rgba(255,255,255,.92);color:#222;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18);font-family:inherit}
#bar button.on{background:#1450a0;color:#fff}
#bar .sep{width:10px}
#legend{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.93);border-radius:10px;padding:12px 16px;font-size:13.5px;line-height:1.55;box-shadow:0 1px 6px rgba(0,0,0,.18);max-width:290px;z-index:2}
#legend h3{margin:0 0 6px;font-size:16px;cursor:pointer;user-select:none}
#legend h3::after{content:" ▾";font-size:12px;color:#888}
#legend.closed h3{margin:0}#legend.closed h3::after{content:" ▸"}
#legend.closed>div{display:none}
@media (max-width:640px){
#bar{top:max(8px,env(safe-area-inset-top));left:8px;right:8px;gap:5px}
#bar button{padding:7px 10px;font-size:13.5px}
#bar .sep{display:none}
#legend{top:auto;right:8px;left:8px;bottom:max(8px,env(safe-area-inset-bottom));max-width:none;padding:8px 12px;font-size:12.5px;line-height:1.45;max-height:42vh;overflow:auto}
#legend h3{font-size:14px}
}
#legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
#legend .hint{color:#666;font-size:12px;margin-top:6px}
body.shot #bar,body.shot #legend .hint{display:none}
</style></head><body>
<div id="view"></div>
<div id="bar">
<button data-view="iso">透視</button><button data-view="top">俯視</button><button data-view="front">正面（門口）</button>
<span class="sep"></span>
<button id="cut" class="on">自動剖切</button><button id="ceil" class="on">天花板</button><button id="lbl" class="on">標註</button>
<button id="dl">下載 GLB</button>
</div>
<div id="legend">
<h3>空間尺寸：寬 5.2 × 深 5.5 × 高 2.6 m</h3>
<div><span class="sw" style="background:#2b2d30"></span>前半：黑色亮面磚（60×60）</div>
<div><span class="sw" style="background:#ece6da"></span>後半：米白磚（60×60）</div>
<div><span class="sw" style="background:#c08a55"></span>左牆：木作直條板 ×6</div>
<div><span class="sw" style="background:#f7f6f2"></span>左後：白色柱體＋壁龕</div>
<div><span class="sw" style="background:#9fc3cc"></span>前方：黑框玻璃隔間＋玻璃門</div>
<div><span class="sw" style="background:#f3f2ee"></span>後牆／右牆：白牆（右牆近門有開關、插座）</div>
<div><span class="sw" style="background:#fffaf0"></span>天花：60 格輕鋼架、LED 平板燈、線型出風口</div>
<div><span class="sw" style="background:#f2c21b"></span>右後角：既有物品（床架、床墊、袋子、紙箱）</div>
<div class="hint">電腦：左鍵拖曳旋轉｜滾輪縮放｜右鍵拖曳平移<br>手機：單指旋轉｜雙指捏合縮放、拖曳平移<br>「自動剖切」會隱藏面向鏡頭的牆與天花板</div>
</div>
<script>(function(){var l=document.getElementById('legend');if(matchMedia('(max-width:640px)').matches)l.classList.add('closed');l.querySelector('h3').addEventListener('click',function(){l.classList.toggle('closed')});})();</script>
